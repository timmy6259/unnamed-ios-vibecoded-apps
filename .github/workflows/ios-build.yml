name: iOS Build & Generate IPA

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app archive (unsigned)
        run: |
          xcodebuild -project ToDoApp.xcodeproj \
            -scheme ToDoApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/ToDoApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Extract app from archive
        run: |
          mkdir -p build/Payload
          cp -r build/ToDoApp.xcarchive/Products/Applications/ToDoApp.app build/Payload/ToDoApp.app

      - name: Create unsigned IPA
        run: |
          cd build
          zip -r ToDoApp.ipa Payload
          ls -lh ToDoApp.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDoApp-unsigned-ipa
          path: build/ToDoApp.ipa
          retention-days: 30

      - name: Create Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/ToDoApp.ipa
