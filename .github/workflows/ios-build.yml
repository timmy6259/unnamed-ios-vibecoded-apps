name: iOS Build & Generate IPA

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app for iOS device (unsigned)
        run: |
          xcodebuild -project ToDoApp.xcodeproj \
            -scheme ToDoApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Generate unsigned IPA
        run: |
          mkdir -p build/ipa
          cd build/Build/Products/Release-iphoneos
          zip -r ../../../ipa/ToDoApp.ipa ToDoApp.app

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDoApp-unsigned-ipa
          path: build/ipa/ToDoApp.ipa
          retention-days: 30

      - name: Create Release (optional)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/ipa/ToDoApp.ipa
